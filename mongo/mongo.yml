services:
  mongo:
    image: mongodb/mongodb-community-server:8.0.19-ubuntu2204
    container_name: mongo
#    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--keyFile", "/data/mongo.key"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      
#      MONGODB_INITDB_ROOT_USERNAME: root
#      MONGODB_INITDB_ROOT_PASSWORD: root

#      MONGO_INITDB_DATABASE
#      MONGO_INITDB_ROOT_USERNAME
#      MONGO_INITDB_ROOT_PASSWORD
#      MONGO_USERNAME
#      MONGO_PASSWORD
#      MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
#      MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
#      MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - /opt/mongo/data:/data/db
      - /opt/mongo/mongo.key:/data/mongo.key
      - /opt/mongo/init.js:/docker-entrypoint-initdb.d/init.js

#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    healthcheck:
#      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 --quiet
#      interval: 5s
#      timeout: 30s
#      start_period: 0s
#      start_interval: 1s
#      retries: 30

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
    restart: unless-stopped
